<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch</title>
</head>
<body>
    <!-- 사용자 목록(이름, 이메일)이 출력될 ul 태그 -->
    <ul id="user-list"></ul>

    <script>
        // [설명] 지정한 URL로 fetch 요청을 보내고 JSON 데이터를 반환하는 재사용 가능한 비동기 함수
        async function fetchData(url) {
            // [설명] await: 서버 응답이 올 때까지 기다림
            const response = await fetch(url);

            // [설명] HTTP 상태 코드가 200번대가 아니면 에러 발생
            if (!response.ok) {
                throw new Error(`요청 실패: ${response.status}`);
            }

            // [설명] 응답 본문을 JSON 객체로 변환하여 반환
            return await response.json();
        }

        // [설명] 데이터 배열을 받아 지정한 ul 요소에 li 목록으로 출력하는 함수
        //        format: 각 항목을 li에 표시할 문자열로 바꾸는 콜백 함수
        function renderList(listEl, items, format) {
            // [설명] 각 항목마다 li 요소를 만들어 ul에 추가
            items.forEach(item => {
                const li = document.createElement('li');
                li.textContent = format(item);
                listEl.appendChild(li);
            });
        }

        // [설명] 전체 흐름을 실행하는 메인 함수: 데이터 요청 -> 화면 출력
        async function main() {
            // [설명] 출력 대상 ul 요소 선택
            const listEl = document.getElementById('user-list');

            try {
                // [설명] users API 호출
                const users = await fetchData('https://jsonplaceholder.typicode.com/users');

                // [설명] "이름 (이메일)" 형식으로 목록 출력
                renderList(listEl, users, user => `${user.name} (${user.email})`);
            } catch (err) {
                // [설명] 네트워크 오류 등 예외 처리
                console.error('데이터를 가져오지 못했습니다:', err);
            }
        }

        // [설명] 페이지 로드 시 실행
        main();
    </script>
</body>
</html>
