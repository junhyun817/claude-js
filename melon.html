<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멜론 차트2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="css/melon.css">
</head>
<body>
    <div class="wrap">
        <h1 class="page-title">멜론 <em>TOP 100</em></h1>

        <section class="top">
            <div class="swiper top-swiper">
                <div class="swiper-wrapper" id="topTrack"></div>
            </div>
            <div class="top-nav">
                <button class="nav-btn" id="topPrev" aria-label="이전">‹</button>
                <button class="nav-btn" id="topNext" aria-label="다음">›</button>
            </div>
        </section>

        <h2 class="sec-title">13위 ~ 100위</h2>
        <ul class="chart-list" id="chartList"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/melon.js"></script>
</body>
</html>
